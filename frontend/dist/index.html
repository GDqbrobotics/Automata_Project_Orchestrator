<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTOMATA – GUI Orchestrator</title>
  <script type="module" crossorigin src="/assets/index-DFQUlTwn.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-IqP-3Chi.css">
</head>
<body>
  <div class="app">

    <!-- ── Top bar ─────────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke="currentColor" stroke-width="2" />
            <circle cx="12" cy="12" r="3.2" fill="currentColor" />
          </svg>
        </span>
        <h1>AUTOMATA <span>GUI Orchestrator</span></h1>
      </div>
      <div class="connection-indicator" role="status">
        <span class="connection-dot" id="connectionDot"></span>
        <span class="connection-text" id="connectionText">Disconnected</span>
      </div>
    </header>

    <!-- ── Control deck ────────────────────────────────────────────── -->
    <section class="panel control-panel" aria-label="Workflow control">
      <div class="control-state">
        <div class="state-badge idle" id="stateBadge">idle</div>
        <p class="workflow-message" id="workflowMessage">Waiting for operator input</p>
      </div>

      <div class="control-progress">
        <div class="progress-head">
          <span class="progress-label" id="progressLabel">Progress: 0 / 0</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="progress-bar" role="progressbar" aria-label="Workflow progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="control-actions">
        <div class="actions">
          <button class="btn btn-primary" id="btnStart">▶ Start</button>
          <button class="btn btn-warning" id="btnPause" disabled>⏸ Pause</button>
          <button class="btn btn-success" id="btnResume" disabled>⏵ Resume</button>
          <button class="btn btn-danger" id="btnStop">⏹ Stop</button>
        </div>
        <div class="actions actions-aux">
          <button class="btn btn-ghost" id="btnReset" disabled>↺ Reset</button>
          <button class="btn btn-ghost" id="btnStatus">⟳ Refresh status</button>
        </div>
      </div>

      <div class="alias-row">
        <label class="alias-label" for="aliasInput">Assign alias ID</label>
        <div class="alias-input-group">
          <input
            type="text"
            class="alias-input"
            id="aliasInput"
            placeholder="Object ID → Alias (e.g. OBJ_003 → AMPHORA_7)"
            autocomplete="off"
          />
          <button class="btn btn-ghost" id="aliasBtn">Assign</button>
        </div>
      </div>
    </section>

    <!-- ── Objects + Subsystems ────────────────────────────────────── -->
    <div class="mid">

      <section class="panel objects-panel" aria-label="Object analysis progress">
        <div class="panel-header">
          <h2>Object analysis</h2>
          <span class="panel-count" id="objectsCount">0 objects</span>
        </div>
        <div class="panel-body scroll-body">
          <div class="object-grid" id="objectsGrid"></div>
        </div>
      </section>

      <section class="panel subsystems-panel" aria-label="Subsystems status">
        <div class="panel-header">
          <h2>Subsystems</h2>
          <span class="panel-count" id="subsystemsCount">0</span>
        </div>
        <div class="panel-body scroll-body">
          <div class="subsystem-grid" id="subsystemGrid"></div>
        </div>
      </section>

    </div>

    <!-- ── Event log ───────────────────────────────────────────────── -->
    <section class="panel log-panel" aria-label="Event log">
      <div class="panel-header">
        <h2>Event log</h2>
      </div>
      <div class="panel-body log-body">
        <div class="event-log" id="eventLog"></div>
      </div>
    </section>

  </div>

</body>
</html>
