name: object_analysis_workflow
initial_state: identified_in_box

states:
  identified_in_box:
    description: Object has been identified in the box by the vision system
    transitions:
      - event: queued_for_analysis
        target: waiting_for_disk
        actions:
          - log_event

  waiting_for_disk:
    description: Object is in the box, waiting for a free disk slot and the robot (the platform holds at most 2 objects, the robot carries at most 1)
    transitions:
      - event: object_picked
        target: moving_to_disk
        actions:
          - log_event
          - event: robot_first/pick

  moving_to_disk:
    description: Object is being moved from the box to the rotating platform disk
    transitions:
      - event: object_placed_on_disk
        target: object_going_second_position
        actions:
          - log_event
          # Rotation request to the pipeline controller (workflow/ scope is
          # internal): the platform rotates BOTH disks at once, so the
          # actual rotating_platform command is issued by the orchestrator,
          # not by this transition.
          - event: workflow/rotation_requested_second

  object_going_second_position:
    description: Object waits on the first disk for a platform rotation to the second imaging position (3DI, then HSI, are performed by robot 2)
    transitions:
      - event: platform_rotated_to_second
        target: 3DI_analysis
        actions:
          - log_event
          # 3DI is the first imaging stage on the second position.
          - event: imaging_3di/capture
          - event: robot_second/scan_3d

  3DI_analysis:
    description: 3D imaging capture is being performed on the object (second position, first imaging stage)
    transitions:
      - event: 3di_capture_complete
        target: HSI_analysis
        actions:
          - log_event
          # 3DI is done: the HSI capture starts (same position, same robot).
          - event: imaging_hsi/capture
          - event: robot_second/scan_hsi

  HSI_analysis:
    description: Hyperspectral imaging capture is being performed on the object (second position, second imaging stage)
    transitions:
      - event: hsi_capture_complete
        target: object_going_first_position
        actions:
          - log_event
          # The AI starts planning the XRF/Raman points from the imaging
          # data in parallel with the rotation back to the first position;
          # the object waits in ai_processing until the AI reports done.
          - event: ai_analysis/plan
          # Rotation request to the pipeline controller (workflow/ scope is
          # internal): the platform only rotates when BOTH disk positions
          # are stable, so the actual rotating_platform command is issued
          # by the orchestrator, not by this transition.
          - event: workflow/rotation_requested_first

  object_going_first_position:
    description: Object waits on the second disk for a platform rotation back to the first measurement position (XRF/Raman is performed by robot 1)
    transitions:
      - event: platform_rotated_to_first
        target: ai_processing
        actions:
          - log_event

  ai_processing:
    description: Object is on the first position while the AI processes its imaging data to extract the interest points for the XRF/Raman measurements
    transitions:
      - event: ai_complete
        target: XRF_RAMAN_analysis
        actions:
          - log_event
          # The AI finished its analysis: the target points are known, so
          # the puntual measurements start (robot 1 + the two analyzers).
          - event: robot_first/measure_xrf_raman
          - event: xrf/measure
          - event: raman/measure

  XRF_RAMAN_analysis:
    description: XRF and Raman puntual measurements are being performed at AI-extracted points (first position)
    transitions:
      - event: measurements_complete
        target: moving_to_box
        actions:
          - log_event
          - event: robot_first/return

  moving_to_box:
    description: Object is being moved from the disk back to its original position in the box
    transitions:
      - event: object_returned_to_box
        target: object_analyzed
        actions:
          - log_event
          # No subsystem command: the object's data is stored locally on
          # the machine; the local database is updated manually (no cloud).

  object_analyzed:
    description: Object analysis is complete – data is stored locally (the local database is updated manually)
