name: object_analysis_workflow
initial_state: identified_in_box

# Physical facts of the machine the pipeline controller needs. The states,
# transitions and events below stay the single source of truth for the
# object flow; this metadata only adds the *where* and *who* of each stage
# (docs/CONFIG_CHANGE_GUIDE.md, R2):
#
#   meta.position         where the object physically is:
#                         `box` (in the box), `hand` (in the robot's end
#                         effector) or a disk name (from `disk_names`)
#   meta.actor            the single subsystem working on the object in
#                         this state (its completion advances the object
#                         over the state's outgoing transition)
#   meta.parallel_actors  subsystems that must ALL complete for the state
#                         to end (the measurement stage)
#   meta.rotate_request   the `workflow/`-scoped event this state requests
#                         (consumed by the pipeline controller, which
#                         decides when a rotation is physically safe)
#   meta.rotate_command   the rotating_platform command that fulfils the
#                         request (issued by the pipeline controller)
#   meta.actor_op         the task-chain op (below) the actor performs in
#                         this state (its command was fired by the
#                         transition that entered the state)
metadata:
  # Rotating platform disk slots (a rotation moves BOTH disks at once).
  disks: 2
  disk_names: [disk_first, disk_second]
  # End effectors of the dispatching robot (objects in transit).
  hand_slots: 1
  # Multi-step robot work per object: when the op's work completes the
  # pipeline issues `next_command` on the robot (if any) and, once the
  # op/chain is done, fires `done_event` on the object (releasing the
  # `releases` disk slot, if any). `object_event` names the object
  # transition whose actions start the op (the transition also commands
  # the robot); `op` names the op for states carrying `actor_op`.
  task_chains:
    robot_first:
      - op: pick
        object_event: object_picked
        next_command: place
        done_event: object_placed_on_disk
      - op: return
        done_event: object_returned_to_box
        releases: disk_first

states:
  identified_in_box:
    description: Object has been identified in the box by the vision system
    meta: { position: box }
    transitions:
      - event: queued_for_analysis
        target: waiting_for_disk
        actions:
          - log_event

  waiting_for_disk:
    description: Object is in the box, waiting for a free disk slot and the robot (the platform holds at most 2 objects, the robot carries at most 1)
    meta: { position: box }
    transitions:
      - event: object_picked
        target: moving_to_disk
        actions:
          - log_event
          - event: robot_first/pick

  moving_to_disk:
    description: Object is being moved from the box to the rotating platform disk
    meta: { position: hand }
    transitions:
      - event: object_placed_on_disk
        target: object_going_second_position
        actions:
          - log_event
          # Rotation request to the pipeline controller (workflow/ scope is
          # internal): the platform rotates BOTH disks at once, so the
          # actual rotating_platform command is issued by the orchestrator,
          # not by this transition.
          - event: workflow/rotation_requested_second

  object_going_second_position:
    description: Object waits on the first disk for a platform rotation to the second imaging position (3DI, then HSI, are performed by robot 2)
    meta:
      position: disk_first
      rotate_request: rotation_requested_second
      rotate_command: rotate_to_second
    transitions:
      - event: platform_rotated_to_second
        target: 3DI_analysis
        actions:
          - log_event
          # 3DI is the first imaging stage on the second position.
          - event: imaging_3di/capture
          - event: robot_second/scan_3d

  3DI_analysis:
    description: 3D imaging capture is being performed on the object (second position, first imaging stage)
    meta: { position: disk_second, actor: imaging_3di }
    transitions:
      - event: 3di_capture_complete
        target: HSI_analysis
        actions:
          - log_event
          # 3DI is done: the HSI capture starts (same position, same robot).
          - event: imaging_hsi/capture
          - event: robot_second/scan_hsi

  HSI_analysis:
    description: Hyperspectral imaging capture is being performed on the object (second position, second imaging stage)
    meta: { position: disk_second, actor: imaging_hsi }
    transitions:
      - event: hsi_capture_complete
        target: object_going_first_position
        actions:
          - log_event
          # The AI starts planning the XRF/Raman points from the imaging
          # data in parallel with the rotation back to the first position;
          # the object waits in ai_processing until the AI reports done.
          - event: ai_analysis/plan
          # Rotation request to the pipeline controller (workflow/ scope is
          # internal): the platform only rotates when BOTH disk positions
          # are stable, so the actual rotating_platform command is issued
          # by the orchestrator, not by this transition.
          - event: workflow/rotation_requested_first

  object_going_first_position:
    description: Object waits on the second disk for a platform rotation back to the first measurement position (XRF/Raman is performed by robot 1)
    meta:
      position: disk_second
      rotate_request: rotation_requested_first
      rotate_command: rotate_to_first
    transitions:
      - event: platform_rotated_to_first
        target: ai_processing
        actions:
          - log_event

  ai_processing:
    description: Object is on the first position while the AI processes its imaging data to extract the interest points for the XRF/Raman measurements
    meta: { position: disk_first, actor: ai_analysis }
    transitions:
      - event: ai_complete
        target: puntual_measurements
        actions:
          - log_event
          # No commands here: the points-dispatch state below decides what
          # to measure next (one event per remaining point of interest).

  puntual_measurements:
    description: Object is on the first position while its stored points of interest are measured one by one (the pipeline dispatches the next analysis)
    meta:
      position: disk_first
      # Points dispatch (R13): the pipeline fires the first event whose
      # label still has unconsumed points in the object's stored points
      # of interest (in declaration order), and the done event when none
      # remain. Each analysis round consumes its point at command time
      # (select: next in the robot's points_requests) and returns here.
      points_dispatch:
        done_event: puntual_measurements_complete
        remaining:
          - { event: analyze_next_xrf_point, kind: points_of_interest, label: xrf }
          - { event: analyze_next_raman_point, kind: points_of_interest, label: raman }
    transitions:
      - event: analyze_next_xrf_point
        target: XRF_analysis
        actions:
          - log_event
          # One XRF point is measured per round (the robot receives the
          # next unconsumed point pushed on its /points topic).
          - event: robot_first/measure_xrf
          - event: xrf/measure
      - event: analyze_next_raman_point
        target: RAMAN_analysis
        actions:
          - log_event
          - event: robot_first/measure_raman
          - event: raman/measure
      - event: puntual_measurements_complete
        target: moving_to_box
        actions:
          - log_event
          - event: robot_first/return

  XRF_analysis:
    description: XRF puntual measurements are being performed at AI-extracted points (first position)
    meta: { position: disk_first, parallel_actors: [robot_first, xrf] }
    transitions:
      - event: xrf_measurement_complete
        target: puntual_measurements
        actions:
          - log_event

  RAMAN_analysis:
    description: Raman puntual measurements are being performed at AI-extracted points (first position)
    meta: { position: disk_first, parallel_actors: [robot_first, raman] }
    transitions:
      - event: raman_measurement_complete
        target: puntual_measurements
        actions:
          - log_event

  moving_to_box:
    description: Object is being moved from the disk back to its original position in the box
    meta: { position: disk_first, actor: robot_first, actor_op: return }
    transitions:
      - event: object_returned_to_box
        target: object_analyzed
        actions:
          - log_event
          # No subsystem command: the object's data is stored locally on
          # the machine; the local database is updated manually (no cloud).

  object_analyzed:
    description: Object analysis is complete – data is stored locally (the local database is updated manually)
    meta: { position: box }
