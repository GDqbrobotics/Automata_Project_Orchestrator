# Workflow Actions Configuration
# Maps object state machine events to subsystem commands.
#
# Each event can trigger one or more subsystem commands.
# The system processes them sequentially in the order listed.
#
# Placeholders available in payloads:
#   {{object_id}}  — the current object's ID

event_actions:
  trigger_robot_first_pick:
    - subsystem: robot_first
      command: pick_object
      payload:
        object_id: "{{object_id}}"

  trigger_imaging_capture:
    - subsystem: imaging_3di_hsi
      command: start_capture
      payload:
        object_id: "{{object_id}}"

  trigger_platform_rotate_to_second:
    - subsystem: rotating_platform
      command: rotate_to_second
      payload:
        object_id: "{{object_id}}"

  trigger_measurements:
    - subsystem: ai_analysis
      command: plan_measurements
      payload:
        object_id: "{{object_id}}"
    - subsystem: xrf
      command: start_measurement
      payload:
        object_id: "{{object_id}}"
    - subsystem: raman
      command: start_measurement
      payload:
        object_id: "{{object_id}}"

  trigger_platform_rotate_to_first:
    - subsystem: rotating_platform
      command: rotate_to_first
      payload:
        object_id: "{{object_id}}"

  trigger_robot_first_return:
    - subsystem: robot_first
      command: return_object
      payload:
        object_id: "{{object_id}}"

  trigger_cloud_upload:
    - subsystem: cloud_database
      command: upload_data
      payload:
        object_id: "{{object_id}}"
