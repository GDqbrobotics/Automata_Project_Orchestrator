# AUTOMATA Subsystem Configuration
#
# This file defines all subsystems that the orchestrator manages.
# Each subsystem entry specifies its identity, MQTT topics, initial state,
# and optional metadata. The orchestrator uses this configuration to:
#   - Dynamically create adapter instances
#   - Subscribe to the correct MQTT topics
#   - Build the frontend subsystem grid
#   - Drive the simulation
#
# To add a new subsystem:
#   1. Add an entry below with a unique `name`
#   2. Set `display_name` for human-readable labels
#   3. Define the MQTT topic pattern (uses {name} placeholder)
#   4. Set `initial_state` to: ready | busy | offline | error
#   5. Set `required: true` if the workflow cannot proceed without it
#   6. Optionally add `metadata` (e.g., hardware model, location)

subsystems:
  - name: vision
    display_name: Vision System
    type: camera
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: true
    metadata:
      description: "RGB-D camera for object detection and ID creation"
      hardware: "Intel RealSense D455"

  - name: robot_first
    display_name: Robot Arm 1
    type: robot
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: true
    metadata:
      description: "First Universal Robot arm – pick-and-place and 3DI/HSI handling"
      hardware: "UR5e with custom end effector"

  - name: robot_second
    display_name: Robot Arm 2
    type: robot
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: true
    metadata:
      description: "Second Universal Robot arm – XRF/Raman measurement positioning"
      hardware: "UR5e with custom end effector"

  - name: rotating_platform
    display_name: Rotating Platform
    type: platform
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: true
    metadata:
      description: "Motorized rotary stage with transparent disks"

  - name: xrf
    display_name: XRF Analyzer
    type: analyzer
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: true
    metadata:
      description: "Micro-X-ray fluorescence spectrometer"

  - name: raman
    display_name: Raman Spectrometer
    type: analyzer
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: true
    metadata:
      description: "Raman spectroscopy system for molecular analysis"

  - name: imaging_3di_hsi
    display_name: 3DI/HSI Imaging
    type: imaging
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: true
    metadata:
      description: "3D imaging and hyperspectral imaging modules"

  - name: ai_analysis
    display_name: AI Analysis
    type: computation
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: false
    metadata:
      description: "AI-based interest point extraction for measurement planning"

  - name: cloud_database
    display_name: Cloud Database
    type: storage
    mqtt_topic: "automata/subsystem/{name}"
    initial_state: ready
    required: false
    metadata:
      description: "Cloud storage for digital twin records"
