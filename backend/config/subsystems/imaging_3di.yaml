# 3DI Imaging Subsystem Configuration
name: imaging_3di
display_name: 3DI Imaging
type: imaging
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "3D imaging module (performed first, before HSI)"
  # Simulation timings (seconds) used by backend/simulation/imaging_3di_sim.py
  init_duration: 1.5
  work_durations:
    capturing: 3.0

states:
  initializing:
    description: "3DI imaging system is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "3DI imaging system is ready and idle"
    transitions:
      - event: capture
        target: capturing
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  capturing:
    description: "System is capturing 3DI data"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "3DI imaging system has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: capture
        target: capturing
        actions:
          - log_event

  error:
    description: "3DI imaging system is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
