# Robot Arm 2 Subsystem Configuration
name: robot_second
display_name: Robot Arm 2
type: robot
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "Second Universal Robot arm – XRF/Raman measurement positioning"
  hardware: "UR5e with custom end effector"

states:
  initializing:
    description: "Robot is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event
          - publish_mqtt_message: subsystem/robot_second/ready

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Robot is ready and idle"
    transitions:
      - event: start
        target: running
        actions:
          - log_event
          - publish_mqtt_message: subsystem/robot_second/running

      - event: error
        target: error
        actions:
          - log_event

  running:
    description: "Robot is actively positioning"
    transitions:
      - event: pause
        target: paused
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event
          - publish_mqtt_message: subsystem/robot_second/stopped

      - event: error
        target: error
        actions:
          - log_event

  paused:
    description: "Robot is paused"
    transitions:
      - event: resume
        target: running
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

  stopped:
    description: "Robot has stopped"
    transitions:
      - event: start
        target: running
        actions:
          - log_event

      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "Robot is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
