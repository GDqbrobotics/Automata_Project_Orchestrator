# Robot Arm 2 Subsystem Configuration (placeholder)
name: robot_second
display_name: Robot Arm 2
type: robot
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: false
metadata:
  description: "Second Universal Robot arm (optional)"

states:
  initializing:
    description: "Robot is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Robot is ready and idle"
    transitions:
      - event: pick
        target: picking
        actions:
          - log_event

      - event: return
        target: returning
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  picking:
    description: "Robot is picking object"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  returning:
    description: "Robot is returning object"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Robot has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "Robot is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
