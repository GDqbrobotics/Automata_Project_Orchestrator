# Robot Arm 2 Subsystem Configuration
name: robot_second
display_name: Robot Arm 2
type: robot
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "Second robot arm – 3DI/HSI scanning"
  hardware: "Custom end effector (HSI + 3DI)"
  # Simulation timings (seconds) used by backend/simulation/robot_second_sim.py
  init_duration: 1.5
  work_durations:
    scanning_hsi_3d: 4.0

states:
  initializing:
    description: "Robot is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Robot is ready and idle"
    transitions:
      - event: scan_hsi_3d
        target: scanning_hsi_3d
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  scanning_hsi_3d:
    description: "Robot is executing the 3DI/HSI scan trajectory"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Robot has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: scan_hsi_3d
        target: scanning_hsi_3d
        actions:
          - log_event

  error:
    description: "Robot is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
