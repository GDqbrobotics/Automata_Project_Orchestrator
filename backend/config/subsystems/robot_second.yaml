# Robot Arm 2 Subsystem Configuration (placeholder)
name: robot_second
display_name: Robot Arm 2
type: robot
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: false
metadata:
  description: "Second Universal Robot arm (optional)"
  # Simulation timings (seconds) used by backend/simulation/robot_second_sim.py
  init_duration: 1.5
  work_durations:
    using_xrf: 6.0
    using_raman: 6.0

states:
  initializing:
    description: "Robot is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Robot is ready and idle"
    transitions:
      - event: use_xrf
        target: using_xrf
        actions:
          - log_event

      - event: use_raman
        target: using_raman
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  using_xrf:
    description: "Robot is using XRF"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  using_raman:
    description: "Robot is using Raman"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Robot has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "Robot is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
