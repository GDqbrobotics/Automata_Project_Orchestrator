# Raman Spectrometer Subsystem Configuration
name: raman
display_name: Raman Spectrometer
type: analyzer
mqtt_topic: "automata/subsystem/{name}"
initial_state: ready
required: true
metadata:
  description: "Raman spectroscopy system for molecular analysis"

states:
  ready:
    description: "Spectrometer is ready and idle"
    transitions:
      - event: start
        target: measuring
        actions:
          - log_event
          - publish_mqtt_message: subsystem/raman/measuring

      - event: error
        target: error
        actions:
          - log_event

  measuring:
    description: "Spectrometer is performing Raman measurement"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event
          - publish_mqtt_message: subsystem/raman/ready

      - event: stop
        target: stopped
        actions:
          - log_event
          - publish_mqtt_message: subsystem/raman/stopped

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Spectrometer has stopped"
    transitions:
      - event: start
        target: measuring
        actions:
          - log_event

      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "Spectrometer is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
