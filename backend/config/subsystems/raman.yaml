# Raman Spectrometer Subsystem Configuration
name: raman
display_name: Raman Spectrometer
type: analyzer
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "Raman spectroscopy system for molecular analysis"
  # Simulation timings (seconds) used by backend/simulation/raman_sim.py
  init_duration: 1.5
  work_durations:
    measuring: 6.0

states:
  initializing:
    description: Spectrometer is initializing
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event
      - event: error
        target: error
        actions:
          - log_event
  ready:
    description: Spectrometer is ready and idle
    transitions:
      - event: measure
        target: measuring
        actions:
          - log_event
      - event: error
        target: error
        actions:
          - log_event
  measuring:
    description: Spectrometer is performing Raman measurement
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event
      - event: stop
        target: stopped
        actions:
          - log_event
      - event: error
        target: error
        actions:
          - log_event
  stopped:
    description: Spectrometer has stopped
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event
      - event: measure
        target: measuring
        actions:
          - log_event
  error:
    description: Spectrometer is in error state
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
