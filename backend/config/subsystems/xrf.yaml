# XRF Analyzer Subsystem Configuration
name: xrf
display_name: XRF Analyzer
type: analyzer
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "Micro-X-ray fluorescence spectrometer"

states:
  initializing:
    description: "Analyzer is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Analyzer is ready and idle"
    transitions:
      - event: measure
        target: measuring
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  measuring:
    description: "Analyzer is performing XRF measurement"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Analyzer has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: measure
        target: measuring
        actions:
          - log_event

  error:
    description: "Analyzer is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
