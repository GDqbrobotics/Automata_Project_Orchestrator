# Rotating Platform Subsystem Configuration
name: rotating_platform
display_name: Rotating Platform
type: platform
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "Motorized rotary stage with transparent disks"
  hardware: "Motorized rotary stage"
  # Simulation timings (seconds) used by backend/simulation/rotating_platform_sim.py
  init_duration: 1.5
  work_durations:
    rotating: 2.0

states:
  initializing:
    description: "Subsystem is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Subsystem is ready and idle"
    transitions:
      - event: rotate_to_second
        target: rotating
        actions:
          - log_event

      - event: rotate_to_first
        target: rotating
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  rotating:
    description: "Subsystem is rotating"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Subsystem has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: rotate_to_second
        target: rotating
        actions:
          - log_event

      - event: rotate_to_first
        target: rotating
        actions:
          - log_event

  error:
    description: "Subsystem is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
