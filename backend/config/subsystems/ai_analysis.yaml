# AI Analysis Subsystem Configuration
name: ai_analysis
display_name: AI Analysis
type: computation
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: false
metadata:
  description: "AI-based interest point extraction for measurement planning"
  # Simulation timings (seconds) used by backend/simulation/ai_analysis_sim.py
  init_duration: 1.5
  work_durations:
    analyzing: 5.0
  # Points of interest (R12/R13b): after planning, the AI reports the
  # surface points [x, y, z, r, p, y] it extracted for the analyzed
  # object, labeled after the analyzer that will measure it. The number
  # of points is whatever this report carries — the dispatch walks them
  # one per round (select: next in the robot's points_requests). `labels`
  # is the label vocabulary; `count` would fix the simulated amount (omit
  # it for a dynamic per-object count in simulation).
  reports:
    - type: object_points
      after: { from: analyzing, to: ready }
      points:
        kind: points_of_interest
        dimensions: 6
        labels: [xrf, raman]

states:
  initializing:
    description: "AI system is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "AI system is ready and idle"
    transitions:
      - event: plan
        target: analyzing
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  analyzing:
    description: "AI system is processing data"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "AI system has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: plan
        target: analyzing
        actions:
          - log_event

  error:
    description: "AI system is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
