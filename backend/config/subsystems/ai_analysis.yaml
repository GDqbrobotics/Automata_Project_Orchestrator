# AI Analysis Subsystem Configuration
name: ai_analysis
display_name: AI Analysis
type: computation
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: false
metadata:
  description: "AI-based interest point extraction for measurement planning"
  # Simulation timings (seconds) used by backend/simulation/ai_analysis_sim.py
  init_duration: 1.5
  work_durations:
    analyzing: 5.0

states:
  initializing:
    description: "AI system is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "AI system is ready and idle"
    transitions:
      - event: plan
        target: analyzing
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  analyzing:
    description: "AI system is processing data"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "AI system has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: plan
        target: analyzing
        actions:
          - log_event

  error:
    description: "AI system is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
