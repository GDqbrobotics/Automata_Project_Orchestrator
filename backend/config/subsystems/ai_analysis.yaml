# AI Analysis Subsystem Configuration
name: ai_analysis
display_name: AI Analysis
type: computation
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: false
metadata:
  description: "AI-based interest point extraction for measurement planning"

states:
  initializing:
    description: "AI system is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event
          - publish_mqtt_message: subsystem/ai_analysis/ready

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "AI system is ready and idle"
    transitions:
      - event: start
        target: analyzing
        actions:
          - log_event
          - publish_mqtt_message: subsystem/ai_analysis/analyzing

      - event: error
        target: error
        actions:
          - log_event

  analyzing:
    description: "AI system is processing data"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event
          - publish_mqtt_message: subsystem/ai_analysis/ready

      - event: stop
        target: stopped
        actions:
          - log_event
          - publish_mqtt_message: subsystem/ai_analysis/stopped

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "AI system has stopped"
    transitions:
      - event: start
        target: analyzing
        actions:
          - log_event

      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "AI system is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
