# Robot Arm 1 Subsystem Configuration
name: robot_first
display_name: Robot Arm 1
type: robot
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "First Universal Robot arm – pick-and-place and 3DI/HSI handling"
  hardware: "UR5e with custom end effector"

states:
  initializing:
    description: "Robot is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event
          - publish_mqtt_message: subsystem/robot_first/ready

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Robot is ready and idle"
    transitions:
      - event: start
        target: running
        actions:
          - log_event
          - publish_mqtt_message: subsystem/robot_first/running

      - event: tool_change
        target: tool_changing
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  tool_changing:
    description: "Robot is changing end effector"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  running:
    description: "Robot is actively moving"
    transitions:
      - event: pause
        target: paused
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event
          - publish_mqtt_message: subsystem/robot_first/stopped

      - event: error
        target: error
        actions:
          - log_event

  paused:
    description: "Robot is paused"
    transitions:
      - event: resume
        target: running
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

  stopped:
    description: "Robot has stopped"
    transitions:
      - event: start
        target: running
        actions:
          - log_event

      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "Robot is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
