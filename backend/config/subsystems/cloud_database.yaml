# Cloud Database Subsystem Configuration
name: cloud_database
display_name: Cloud Database
type: storage
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: false
metadata:
  description: "Cloud storage for digital twin records"
  # Simulation timings (seconds) used by backend/simulation/cloud_database_sim.py
  init_duration: 1.5
  work_durations:
    uploading: 2.0

states:
  initializing:
    description: "Cloud connection is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Cloud connection is ready and idle"
    transitions:
      - event: upload
        target: uploading
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  uploading:
    description: "System is uploading data to cloud"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Cloud operation has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: upload
        target: uploading
        actions:
          - log_event

  error:
    description: "Cloud service is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
