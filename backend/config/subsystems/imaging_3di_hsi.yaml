# 3DI/HSI Imaging Subsystem Configuration
name: imaging_3di_hsi
display_name: 3DI/HSI Imaging
type: imaging
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "3D imaging and hyperspectral imaging modules"

states:
  initializing:
    description: "Imaging system is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event
          - publish_mqtt_message: subsystem/imaging_3di_hsi/ready

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Imaging system is ready and idle"
    transitions:
      - event: start
        target: capturing
        actions:
          - log_event
          - publish_mqtt_message: subsystem/imaging_3di_hsi/capturing

      - event: error
        target: error
        actions:
          - log_event

  capturing:
    description: "System is capturing 3DI/HSI data"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event
          - publish_mqtt_message: subsystem/imaging_3di_hsi/ready

      - event: stop
        target: stopped
        actions:
          - log_event
          - publish_mqtt_message: subsystem/imaging_3di_hsi/stopped

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Imaging system has stopped"
    transitions:
      - event: start
        target: capturing
        actions:
          - log_event

      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "Imaging system is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
