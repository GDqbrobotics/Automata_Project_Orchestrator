# HSI Imaging Subsystem Configuration
name: imaging_hsi
display_name: HSI Imaging
type: imaging
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "Hyperspectral imaging module (performed second, after 3DI)"
  # Simulation timings (seconds) used by backend/simulation/imaging_hsi_sim.py
  init_duration: 1.5
  work_durations:
    capturing: 4.0

states:
  initializing:
    description: "HSI imaging system is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "HSI imaging system is ready and idle"
    transitions:
      - event: capture
        target: capturing
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  capturing:
    description: "System is capturing HSI data"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "HSI imaging system has stopped"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: capture
        target: capturing
        actions:
          - log_event

  error:
    description: "HSI imaging system is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
