# Vision System Subsystem Configuration
name: vision
display_name: Vision System
type: camera
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "RGB-D camera for object detection and ID creation"
  hardware: "Intel RealSense D455"

states:
  initializing:
    description: "Camera is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Camera is ready and idle"
    transitions:
      - event: capture
        target: capturing
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  capturing:
    description: "Camera is actively capturing"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Camera has stopped capturing"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: capture
        target: capturing
        actions:
          - log_event

  error:
    description: "Camera is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
