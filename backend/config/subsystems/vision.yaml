# Vision System Subsystem Configuration
name: vision
display_name: Vision System
type: camera
mqtt_topic: "automata/subsystem/{name}"
initial_state: ready
required: true
metadata:
  description: "RGB-D camera for object detection and ID creation"
  hardware: "Intel RealSense D455"

states:
  ready:
    description: "Camera is ready and idle"
    transitions:
      - event: start
        target: running
        actions:
          - log_event
          - publish_mqtt_message: subsystem/vision/running

      - event: error
        target: error
        actions:
          - log_event

  running:
    description: "Camera is actively capturing"
    transitions:
      - event: stop
        target: stopped
        actions:
          - log_event
          - publish_mqtt_message: subsystem/vision/stopped

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Camera has stopped capturing"
    transitions:
      - event: start
        target: running
        actions:
          - log_event

      - event: ready
        target: ready
        actions:
          - log_event

  error:
    description: "Camera is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
