# Vision System Subsystem Configuration
name: vision
display_name: Vision System
type: camera
mqtt_topic: "automata/subsystem/{name}"
initial_state: initializing
required: true
metadata:
  description: "RGB-D camera for object detection and ID creation"
  hardware: "Intel RealSense D455"
  # Simulation timings (seconds) used by backend/simulation/vision_sim.py
  init_duration: 1.5
  work_durations:
    capturing: 3.0
  # Reporting role (docs/CONFIG_CHANGE_GUIDE.md, R5): when the transition
  # `after.from -> after.to` happens, the subsystem publishes a response
  # of `type` on its /response topic. The object IDs are rendered from the
  # global `simulation.object_id_format`; `count_source: num_objects` means
  # the box-scan object count (the process manager passes --num-objects to
  # any sim whose YAML declares such a report).
  reports:
    - type: objects_detected
      after: { from: capturing, to: ready }
      object_ids:
        count_source: num_objects

states:
  initializing:
    description: "Camera is initializing"
    transitions:
      - event: init_complete
        target: ready
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  ready:
    description: "Camera is ready and idle"
    transitions:
      - event: capture
        target: capturing
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  capturing:
    description: "Camera is actively capturing"
    transitions:
      - event: complete
        target: ready
        actions:
          - log_event

      - event: stop
        target: stopped
        actions:
          - log_event

      - event: error
        target: error
        actions:
          - log_event

  stopped:
    description: "Camera has stopped capturing"
    transitions:
      - event: ready
        target: ready
        actions:
          - log_event

      - event: capture
        target: capturing
        actions:
          - log_event

  error:
    description: "Camera is in error state"
    transitions:
      - event: reset
        target: ready
        actions:
          - log_event
