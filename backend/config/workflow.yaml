name: automata_gui_workflow
initial_state: idle

states:
  idle:
    description: Waiting for operator input
    transitions:
      - event: start_requested
        target: starting
        actions:
          - log_event

      - event: reset_requested
        target: idle
        actions:
          - log_event

  starting:
    description: Preparing the workflow
    transitions:
      - event: subsystem_ready
        target: running
        actions:
          - log_event

      - event: stop_requested
        target: stopping
        actions:
          - event: all/stop

      - event: subsystem_error
        target: error
        actions:
          - log_event
          - event: error

  running:
    description: Workflow in progress
    transitions:
      - event: pause_requested
        target: paused
        actions:
          - event: all/pause

      - event: resume_requested
        target: running
        actions:
          - event: all/resume

      - event: stop_requested
        target: stopping
        actions:
          - event: all/stop

      - event: subsystem_error
        target: error
        actions:
          - log_event
          - event: error

  paused:
    description: Workflow temporarily suspended
    transitions:
      - event: resume_requested
        target: running
        actions:
          - event: all/resume

      - event: stop_requested
        target: stopping
        actions:
          - event: all/stop

  stopping:
    description: Stopping workflow
    transitions:
      - event: stopped
        target: stopped
        actions:
          - log_event

  stopped:
    description: Workflow ended (operator can start a new workflow or reset)
    transitions:
      - event: start_requested
        target: starting
        actions:
          - log_event

      - event: reset_requested
        target: idle
        actions:
          - log_event

  error:
    description: Workflow interrupted by error
    transitions:
      - event: start_requested
        target: starting
        actions:
          - log_event

      - event: reset_requested
        target: idle
        actions:
          - log_event
